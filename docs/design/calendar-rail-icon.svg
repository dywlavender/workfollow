<svg width="512" height="512" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 日历 · 侧栏 rail 图标 v4：标准日历造型，比例修正
       - 本体宽 > 高（18 × 15.5），圆角收敛（rx 3），不再像方块/饭盒
       - 吊耳细长，真正立出本体 2.4（v3 只凸起 1.8，看着像凸点）
       - 贯通横线位置约在 1/3 处 -->
  <g fill="#8A8A8E">
    <!-- 本体 -->
    <rect x="3" y="5" width="18" height="15.5" rx="3"/>
    <!-- 吊耳 -->
    <rect x="6.45" y="2.6" width="2.1" height="4.8" rx="1.05"/>
    <rect x="15.45" y="2.6" width="2.1" height="4.8" rx="1.05"/>
  </g>
  <!-- 镂空：贯通横线 -->
  <rect x="3" y="9.8" width="18" height="1.7" fill="#FFFFFF"/>
</svg>
