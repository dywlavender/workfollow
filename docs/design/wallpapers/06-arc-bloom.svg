  <!-- WorkFollow 动态壁纸 · 弧光绽放 v3
       双层细瓣光花：外层 10 瓣淡、内层 10 瓣错 18°，整体缓旋（90s/圈），
       半透明层叠出深浅。中心光核呼吸，左下光斑平衡。深色款。 -->
  <defs>
    <radialGradient id="deep" cx="55%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#241C4A"/>
      <stop offset="55%" stop-color="#171233"/>
      <stop offset="100%" stop-color="#0C0A1E"/>
    </radialGradient>
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4B3A8C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4B3A8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E894B8"/>
      <stop offset="45%" stop-color="#9B5CEB"/>
      <stop offset="100%" stop-color="#3E3AAE"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFE3B8"/>
      <stop offset="35%" stop-color="#E86BB0"/>
      <stop offset="100%" stop-color="#6D4AD8"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6DE" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFC97E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E86BB0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#deep)"/>

  <circle cx="220" cy="880" r="480" fill="url(#cornerGlow)"/>
  <circle cx="1530" cy="80" r="320" fill="url(#cornerGlow)" opacity="0.6"/>

  <g fill="#CDC6F2">
