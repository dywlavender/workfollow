<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- WorkFollow 动态壁纸 · 任务网格脉冲 (Task Grid Pulse)
       月历形状的圆角格阵。不同位置的格子隔一会儿亮一下、画出一个对勾、
       再悄悄退回去——像在壁纸上"完成一件小事"。三条脉冲错峰循环（17s 周期）。 -->
  <rect width="1600" height="1000" fill="#F4F5FC"/>
    <rect x="146" y="81" width="168" height="150" rx="22" fill="#FFFFFF" stroke="#E7E9F6" stroke-width="2"/>
