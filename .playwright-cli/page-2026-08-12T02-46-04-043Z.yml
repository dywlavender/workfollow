            - heading "欢迎使用 WorkFollow" [level=1] [ref=f1e254]
            - paragraph [ref=f1e255]: 这是一份简短的上手指南。完成右侧的新手任务后，你就可以开始管理自己的工作。
            - heading "任务" [level=2] [ref=f1e256]
            - paragraph [ref=f1e257]: 在任务页面创建、编辑任务；勾选任务即可完成。日期、负责人和优先级都可以在任务详情中调整。
            - heading "日期与提醒" [level=2] [ref=f1e258]
            - paragraph [ref=f1e259]: 给任务设置日期后，它会出现在首页、日历和对应的任务视图中；需要提醒时再设置提醒时间。
            - heading "笔记" [level=2] [ref=f1e260]
            - paragraph [ref=f1e261]: 在笔记页面创建和管理个人笔记，可以使用文件夹整理内容，也可以从笔记创建任务。
            - heading "常用" [level=2] [ref=f1e262]
            - paragraph [ref=f1e263]: 常用页面集中展示系统管理员配置的网站。点击网站卡片会在新标签页打开。
            - heading "通知" [level=2] [ref=f1e264]
            - paragraph [ref=f1e265]: 通知页面用于查看任务、团队投稿和审核结果提醒；标记已读与删除通知是两个独立操作。
            - heading "团队与权限" [level=2] [ref=f1e266]
            - paragraph [ref=f1e267]: 团队任务和团队笔记只对有权限的成员开放。OWNER、ADMIN、MEMBER 是团队内部角色，系统 ROOT 是全局权限。
