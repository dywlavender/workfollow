            - heading "欢迎使用 WorkFollow" [level=1] [ref=e234]
            - paragraph [ref=e235]: 这是一份简短的上手指南。完成右侧的新手任务后，你就可以开始管理自己的工作。
            - heading "任务" [level=2] [ref=e236]
            - paragraph [ref=e237]: 在任务页面创建、编辑任务；勾选任务即可完成。日期、负责人和优先级都可以在任务详情中调整。
            - heading "日期与提醒" [level=2] [ref=e238]
            - paragraph [ref=e239]: 给任务设置日期后，它会出现在首页、日历和对应的任务视图中；需要提醒时再设置提醒时间。
            - heading "笔记" [level=2] [ref=e240]
            - paragraph [ref=e241]: 在笔记页面创建和管理个人笔记，可以使用文件夹整理内容，也可以从笔记创建任务。
            - heading "常用" [level=2] [ref=e242]
            - paragraph [ref=e243]: 常用页面集中展示系统管理员配置的网站。点击网站卡片会在新标签页打开。
            - heading "通知" [level=2] [ref=e244]
            - paragraph [ref=e245]: 通知页面用于查看任务、团队投稿和审核结果提醒；标记已读与删除通知是两个独立操作。
            - heading "团队与权限" [level=2] [ref=e246]
            - paragraph [ref=e247]: 团队任务和团队笔记只对有权限的成员开放。OWNER、ADMIN、MEMBER 是团队内部角色，系统 ROOT 是全局权限。
